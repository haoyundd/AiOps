groups:
  - name: merchantflow-real-faults
    rules:
      - alert: MerchantFlowHighCPU
        expr: max(process_cpu_usage{job="merchantflow"}) > 0.80
        for: 1m
        labels:
          severity: warning
          service: merchantflow
          environment: local
          metric: process_cpu_usage
          threshold: "0.80"
        annotations:
          summary: MerchantFlow process CPU is above 80%
          description: Real JVM process CPU has remained above the configured threshold.

      - alert: MerchantFlowHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="merchantflow"}[5m]))) > 1
        for: 1m
        labels:
          severity: warning
          service: merchantflow
          environment: local
          metric: http_server_requests_seconds
          threshold: "1.0"
        annotations:
          summary: MerchantFlow HTTP P95 latency is above one second
          description: Request latency is derived from real Micrometer HTTP histograms.

      - alert: MerchantFlowHighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{job="merchantflow",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job="merchantflow"}[5m])), 0.001) > 0.05
        for: 1m
        labels:
          severity: critical
          service: merchantflow
          environment: local
          metric: http_server_requests_seconds_count
          threshold: "0.05"
        annotations:
          summary: MerchantFlow 5xx rate is above 5%
          description: Real HTTP failures have exceeded the error-rate threshold.

      - alert: MerchantFlowHealthDown
        expr: probe_success{job="merchantflow-health"} == 0
        for: 30s
        labels:
          severity: critical
          service: merchantflow
          environment: local
          metric: probe_success
          threshold: "1"
        annotations:
          summary: MerchantFlow health endpoint is down
          description: Blackbox probing cannot obtain a successful health response.

      # 业务接口会在 MQ 发布失败后回滚并返回可读错误，HTTP 状态不一定是 5xx；
      # 因此必须直接对真实业务失败 Counter 告警，下一步交给 AIOps MCP 取证。
      - alert: MerchantFlowRocketMQPublishFailure
        expr: sum(increase(merchantflow_mq_publish_failures_total{job="merchantflow",flow="seckill-order"}[5m])) > 0
        for: 15s
        labels:
          severity: warning
          service: merchantflow
          environment: local
          metric: merchantflow_mq_publish_failures_total
          threshold: "0"
        annotations:
          summary: MerchantFlow RocketMQ order publishing has failed
          description: The real seckill order publishing path reported at least one failure in five minutes.
