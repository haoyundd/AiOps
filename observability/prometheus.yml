global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: aiops-api
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["api:9900"]
        labels:
          service: aiops-api
          environment: local

  - job_name: merchantflow
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["merchantflow:8081"]
        labels:
          service: merchantflow
          environment: local

  - job_name: merchantflow-health
    metrics_path: /probe
    params:
      module: [http_health]
    static_configs:
      - targets: ["http://merchantflow:8081/actuator/health"]
        labels:
          service: merchantflow
          environment: local
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
