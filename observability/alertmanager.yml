global:
  resolve_timeout: 1m

route:
  receiver: aiops-agent
  group_by: [alertname, service, environment]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 30m

receivers:
  - name: aiops-agent
    webhook_configs:
      - url: http://api:9900/api/v1/alerts/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: __ALERTMANAGER_WEBHOOK_SECRET__
