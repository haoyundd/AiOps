name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check app mcp_servers scripts tests
      - run: uv run mypy app --no-incremental
      - run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=75
      - run: docker compose -f docker-compose.incident.yml --env-file .env.example config --quiet
