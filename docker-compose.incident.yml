services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: incident-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - incident_etcd:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: incident-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - incident_minio:/minio_data
    ports:
      - "9000:9000"
      - "9001:9001"

  milvus:
    image: milvusdb/milvus:v2.5.10
    container_name: incident-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - incident_milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  attu:
    image: zilliz/attu:v2.5
    container_name: incident-attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8000:3000"
    depends_on:
      - milvus

  loki:
    image: grafana/loki:3.2.1
    container_name: incident-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      - incident_loki:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.2.1
    container_name: incident-promtail
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./observability/promtail.yml:/etc/promtail/promtail.yml:ro
      - demo_logs:/app/logs:ro
    depends_on:
      - loki
      - demo-service

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: incident-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - incident_prometheus:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - demo-service
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: incident-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - incident_alertmanager:/alertmanager
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: incident-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  demo-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-demo-service
    command: ["python", "-m", "uvicorn", "demo_service.app:app", "--host", "0.0.0.0", "--port", "9910"]
    volumes:
      - demo_logs:/app/logs
    ports:
      - "9910:9910"

  mcp-log:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-mcp-log
    command: ["python", "mcp_servers/cls_server.py"]
    environment:
      LOKI_URL: http://loki:3100
      DEMO_SERVICE_NAME: demo-service
    ports:
      - "8003:8003"
    depends_on:
      - loki

  mcp-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-mcp-monitor
    command: ["python", "mcp_servers/monitor_server.py"]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      DEMO_SERVICE_NAME: demo-service
    ports:
      - "8004:8004"
    depends_on:
      - prometheus

  mcp-remediation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-mcp-remediation
    command: ["python", "mcp_servers/remediation_server.py"]
    environment:
      DEMO_SERVICE_URL: http://demo-service:9910
    ports:
      - "8005:8005"
    depends_on:
      - demo-service

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-api
    environment:
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      DEMO_SERVICE_URL: http://demo-service:9910
      MCP_CLS_URL: http://mcp-log:8003/mcp
      MCP_MONITOR_URL: http://mcp-monitor:8004/mcp
      MCP_REMEDIATION_URL: http://mcp-remediation:8005/mcp
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-your-api-key-here}
      DASHSCOPE_API_BASE: ${DASHSCOPE_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-max}
      RAG_MODEL: ${RAG_MODEL:-qwen-max}
      LLM_PROVIDER: ${LLM_PROVIDER:-xiaomi}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      XIAOMI_API_KEY: ${XIAOMI_API_KEY:-}
      XIAOMI_API_BASE: ${XIAOMI_API_BASE:-https://api.xiaomimimo.com/v1}
      XIAOMI_MODEL: ${XIAOMI_MODEL:-mimo-v2-flash}
      AIOPS_AUTO_DIAGNOSIS_ENABLED: ${AIOPS_AUTO_DIAGNOSIS_ENABLED:-true}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/volumes/aiops_harness.db}
    volumes:
      - ./volumes:/app/volumes
    ports:
      - "9900:9900"
    depends_on:
      - milvus
      - mcp-log
      - mcp-monitor
      - mcp-remediation

volumes:
  incident_etcd:
  incident_minio:
  incident_milvus:
  incident_loki:
  incident_prometheus:
  incident_alertmanager:
  demo_logs:
