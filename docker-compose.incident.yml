name: aiops-incident-agent

x-app-environment: &app-environment
  ENVIRONMENT: ${ENVIRONMENT:-local}
  DATABASE_URL: postgresql+asyncpg://aiops:${POSTGRES_PASSWORD}@postgres:5432/aiops
  DATABASE_AUTO_CREATE: "false"
  JWT_SECRET: ${JWT_SECRET}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  ALERTMANAGER_WEBHOOK_SECRET: ${ALERTMANAGER_WEBHOOK_SECRET}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:9900}
  PROMETHEUS_URL: http://prometheus:9090
  LOKI_URL: http://loki:3100
  TEMPO_URL: http://tempo:3200
  MERCHANTFLOW_HEALTH_URL: http://merchantflow:8081/actuator/health
  MCP_OPS_URL: http://mcp-ops:8004/mcp
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  DASHSCOPE_API_BASE: ${DASHSCOPE_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-max}
  LLM_PROVIDER: ${LLM_PROVIDER:-dashscope}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LAB_MODE: ${LAB_MODE:-false}
  ALLOW_MUTATIONS: ${ALLOW_MUTATIONS:-false}

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aiops-postgres
    environment:
      POSTGRES_DB: aiops
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - aiops_postgres:/var/lib/postgresql/data
    ports:
      - "${AIOPS_POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [aiops-observe]

  migrate:
    build: .
    container_name: aiops-migrate
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [aiops-observe]

  api:
    build: .
    container_name: aiops-api
    environment: *app-environment
    ports:
      - "9900:9900"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9900/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [aiops-observe]

  worker:
    build: .
    container_name: aiops-worker
    command: ["uv", "run", "python", "-m", "app.worker"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [aiops-observe]

  mcp-ops:
    build: .
    container_name: aiops-mcp-ops
    command: ["uv", "run", "python", "mcp_servers/ops_server.py"]
    environment: *app-environment
    ports:
      - "8004:8004"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks: [aiops-observe]

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: aiops-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - aiops_prometheus:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      alertmanager:
        condition: service_started
    networks: [aiops-observe]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: aiops-alertmanager
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed "s|__ALERTMANAGER_WEBHOOK_SECRET__|$${ALERTMANAGER_WEBHOOK_SECRET}|g"
        /etc/alertmanager/alertmanager.template.yml > /tmp/alertmanager.yml
        && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    environment:
      ALERTMANAGER_WEBHOOK_SECRET: ${ALERTMANAGER_WEBHOOK_SECRET}
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.template.yml:ro
      - aiops_alertmanager:/alertmanager
    ports:
      - "9093:9093"
    networks: [aiops-observe]

  loki:
    image: grafana/loki:3.5.3
    container_name: aiops-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      - aiops_loki:/loki
    ports:
      - "3100:3100"
    networks: [aiops-observe]

  tempo:
    image: grafana/tempo:2.8.2
    container_name: aiops-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - aiops_tempo:/var/tempo
    ports:
      - "3200:3200"
    networks: [aiops-observe]

  alloy:
    image: grafana/alloy:v1.10.0
    container_name: aiops-alloy
    command: ["run", "/etc/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345"]
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "12345:12345"
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks: [aiops-observe]

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    container_name: aiops-blackbox
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./observability/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [aiops-observe]

  grafana:
    image: grafana/grafana:12.1.0
    container_name: aiops-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - aiops_grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks: [aiops-observe]

networks:
  aiops-observe:
    name: aiops-observe

volumes:
  aiops_postgres:
  aiops_prometheus:
  aiops_alertmanager:
  aiops_loki:
  aiops_tempo:
  aiops_grafana:
